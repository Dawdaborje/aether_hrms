[package]
name = "hr_recruitment"
version = "0.1.1"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-sdk = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
