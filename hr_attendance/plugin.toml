[plugin]
name = "hr_attendance"
icon_path = "assets/logo.svg"
label = "Attendance"
version = "0.2.2"
description = "Shifts, punches, daily attendance and corrections."
long_description = """
Raw punches are kept as they came and never edited: a correction is a new punch that supersedes another.
Each person and date has one derived day (present, absent, half day, leave, holiday, weekly off), worked
out by a pure function from the shift's window, the paired punches, the holiday calendar and approved
leave, and recomputed only when its inputs change. A punch that does not pair is flagged for review, never
dropped; working on a day of leave is flagged, not hidden. Corrections are decided by the person's manager
or an attendance administrator, never by the person.
Written in Rust.
See docs/design.md in this plugin (hr_attendance/docs/design.md).
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["hr", "calendar", "hr_leave"]
capabilities = ["db::query", "db::mutate", "events::emit", "plugins::call"]
access_models = [
  { name = "att_location", permissions = ["read", "write"] },
  { name = "att_shift", permissions = ["read", "write"] },
  { name = "att_shift_assignment", permissions = ["read", "write"] },
  { name = "att_punch", permissions = ["read", "write"] },
  { name = "att_day", permissions = ["read", "write"] },
  { name = "att_correction", permissions = ["read", "write"] },
  { name = "att_overtime_rule", permissions = ["read", "write"] },
  { name = "att_overtime", permissions = ["read", "write"] },
  { name = "att_rotation", permissions = ["read", "write"] },
  { name = "att_rotation_step", permissions = ["read", "write"] },
  { name = "att_shift_request", permissions = ["read", "write"] },
  { name = "att_request", permissions = ["read", "write"] },
  { name = "att_kiosk_pin", permissions = ["read", "write"] },
  { name = "att_work_mode", permissions = ["read", "write"] },
  { name = "counter", permissions = ["read", "write"] },
]
is_builtin = false
wasm_file = "out/plugin.wasm"

[[command]]
name = "seed"
function = "seed_general_shift"
help = "Create a General 09:00-17:00 shift when there is no shift (idempotent)"
on_install = true
on_upgrade = true

[[roles]]
name = "att_admin"
label = "Attendance administrator"
description = "Sets up shifts, locations and assignments; decides corrections; overrides days"

[[roles]]
name = "att_corrector"
label = "Attendance record corrector"
description = "May edit or delete punches and locked days. Nobody should hold this in normal use."

[[roles]]
name = "att_kiosk"
label = "Attendance kiosk"
description = "A shared device account that punches people in by employee number and PIN"

[[events]]
name = "punch_recorded"

[[events]]
name = "day_needs_review"

[[events]]
name = "correction_decided"

[[events]]
name = "shift_request_decided"

[[events]]
name = "attendance_request_decided"

# Yesterday's days are settled and missing days marked absent, once the day's window has closed.
[[schedule]]
name = "attendance-nightly"
title = "Settle attendance days"
description = "Settles recent attendance days and marks absences."
function = "attendance_nightly"
cron = "40 0 * * *"

[[command]]
name = "demo_att_shift"
function = "generate_demo_att_shift"
help = "Generate demo attendance shifts"
demo_model = "att_shift"
args = [{ name = "count", type = "int", default = 10 }]

[[command]]
name = "demo_att_location"
function = "generate_demo_att_location"
help = "Generate demo attendance locations"
demo_model = "att_location"
args = [{ name = "count", type = "int", default = 10 }]

[app]
icon = "clock"
route = "/hr/attendance"
description = "Punch in and out, and see your days"

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "hrms"
