[plugin]
name = "hr_config"
icon_path = "assets/logo.svg"
label = "HR Configuration"
version = "0.1.2"
description = "HRMS setup: HR defaults, leave, attendance and payroll configuration."
long_description = """
A single Apps tile for HRMS configuration. The home page lists setup areas
(leave, attendance, payroll, banks, work locations, cost centres, recruitment, …)
so day-to-day apps stay focused on work, not admin. Handlers call into the owning plugins.
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["hr", "hr_leave", "hr_attendance", "hr_payroll", "hr_recruitment", "hr_onboarding", "hr_career", "hr_documents"]
capabilities = ["plugins::call"]
is_builtin = false
wasm_file = "out/plugin.wasm"

[app]
icon = "settings"
route = "/hr/config"
description = "Configure leave, attendance, payroll, locations, and other HRMS setup"
standalone = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "hrms"
