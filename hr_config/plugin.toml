[plugin]
name = "hr_config"
icon_path = "assets/logo.svg"
label = "Configurations"
version = "0.1.0"
description = "HRMS setup: leave types and other configuration."
long_description = """
A single Apps tile for HRMS configuration. Leave types and other setup screens
live here so day-to-day apps (Leave, Attendance, …) stay focused on work, not
admin. Handlers call into the owning plugins (for example hr_leave).
"""
authors = [{ name = "Aether", email = "hello@aether.local" }]
dependencies = ["hr_leave"]
capabilities = ["plugins::call"]
is_builtin = false
wasm_file = "out/plugin.wasm"

[app]
icon = "settings"
route = "/hr/config/leave-types"
description = "Configure leave types and other HRMS setup"
standalone = true

[plugin.api]
version = "0.1"

[plugin.meta]
kind = "addon"
workspace = "hrms"
