[package]
name = "hr_payroll"
version = "0.1.0"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aether-sdk = { path = "../../../sdks/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sp_engine = { path = "../../../../swift_projects/swift_payroll_engine/crates/sp_engine", default-features = false }

[features]
probe = []

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
